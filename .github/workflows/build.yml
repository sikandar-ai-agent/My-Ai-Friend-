name: Build S24 Ultra APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Free Up System Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          df -h

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git python3-dev ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            libltdl-dev zlib1g-dev unzip ant autoconf libtool pkg-config \
            libncurses5:i386 libstdc++6:i386 libz1:i386

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==3.0.8 buildozer requests

      - name: Setup Android SDK Path and Tools
        run: |
          SDK_BASE="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_BASE/cmdline-tools"
          mkdir -p "$SDK_BASE/licenses"

          echo "24333f1a43ef661ef218c0130af61e545e1ebd1d" > "$SDK_BASE/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$SDK_BASE/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_BASE/licenses/android-sdk-preview-license"

          if [ ! -f "$SDK_BASE/cmdline-tools/latest/bin/sdkmanager" ]; then
            TEMP_DIR=$(mktemp -d)
            cd "$TEMP_DIR"
            curl -O https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -o commandlinetools-linux-11076708_latest.zip
            rm -rf "$SDK_BASE/cmdline-tools/latest"
            mkdir -p "$SDK_BASE/cmdline-tools/latest"
            mv cmdline-tools/* "$SDK_BASE/cmdline-tools/latest/"
            cd -
            rm -rf "$TEMP_DIR"
          fi

      - name: Run Buildozer
        run: |
          export PATH=$PATH:$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:$HOME/.buildozer/android/platform/android-sdk/platform-tools
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
